<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1a1005" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Civil War Generals</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { height: 100%; }
      body {
        background: #1a1005;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        height: 100dvh; /* dynamic viewport height — excludes mobile browser chrome */
        overflow: hidden;
        touch-action: none;
      }
      canvas { display: block; image-rendering: pixelated; }

      #portrait-warn {
        display: none;
        position: fixed;
        inset: 0;
        background: #1a1005;
        color: #c8a850;
        font-family: Georgia, serif;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
        gap: 16px;
        z-index: 999;
      }
      #portrait-warn .icon { font-size: 52px; }
      #portrait-warn h2  { font-size: 22px; }
      #portrait-warn p   { font-size: 14px; color: #806838; }

      @media (orientation: portrait) and (max-height: 600px),
             (orientation: portrait) and (max-width: 600px) {
        #portrait-warn { display: flex; }
        canvas { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="portrait-warn">
      <div class="icon">⟳</div>
      <h2>Rotate to Landscape</h2>
      <p>Civil War Generals plays in landscape mode</p>
    </div>
    <canvas id="c"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
