<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark parchment background -->
  <rect width="32" height="32" rx="5" fill="#1a1005"/>

  <!-- Cannon barrel (tapered trapezoid, facing right) -->
  <polygon points="4,14  23,15.5  23,18.5  4,20" fill="#c8a840"/>
  <!-- Barrel highlight -->
  <polygon points="4,14  23,15.5  22,16  4,14.8" fill="#e0c060" opacity="0.6"/>
  <!-- Breech reinforcing ring -->
  <rect x="4" y="13.5" width="3.5" height="7" rx="0.5" fill="#d4b248"/>
  <!-- Muzzle swell -->
  <ellipse cx="23" cy="17" rx="1.8" ry="2.8" fill="#b09030"/>
  <!-- Bore hole -->
  <ellipse cx="23" cy="17" rx="0.7" ry="1.1" fill="#0a0800"/>
  <!-- Touch-hole button on top -->
  <circle cx="10" cy="13.8" r="1.2" fill="#d4b248"/>

  <!-- Carriage / trail (dark wood) -->
  <rect x="3" y="19" width="12" height="3.5" rx="0.8" fill="#5a3c18"/>

  <!-- Large front wheel -->
  <circle cx="9" cy="24" r="6.5" fill="none" stroke="#8a6020" stroke-width="1.8"/>
  <!-- Spokes (8) -->
  <g stroke="#8a6020" stroke-width="0.7">
    <line x1="9" y1="17.5" x2="9" y2="30.5"/>
    <line x1="2.5" y1="24" x2="15.5" y2="24"/>
    <line x1="3.9" y1="19.4" x2="14.1" y2="28.6"/>
    <line x1="14.1" y1="19.4" x2="3.9" y2="28.6"/>
  </g>
  <!-- Hub -->
  <circle cx="9" cy="24" r="1.8" fill="#5a3c18" stroke="#8a6020" stroke-width="0.8"/>

  <!-- Smaller rear wheel -->
  <circle cx="20" cy="23" r="4.5" fill="none" stroke="#8a6020" stroke-width="1.5"/>
  <g stroke="#8a6020" stroke-width="0.6">
    <line x1="20" y1="18.5" x2="20" y2="27.5"/>
    <line x1="15.5" y1="23" x2="24.5" y2="23"/>
    <line x1="16.8" y1="19.8" x2="23.2" y2="26.2"/>
    <line x1="23.2" y1="19.8" x2="16.8" y2="26.2"/>
  </g>
  <circle cx="20" cy="23" r="1.3" fill="#5a3c18" stroke="#8a6020" stroke-width="0.6"/>

  <!-- Cannonball (upper right) -->
  <circle cx="27" cy="7" r="3.2" fill="#7a6830"/>
  <ellipse cx="26" cy="6" rx="1.2" ry="0.8" fill="#a09050" opacity="0.5"/>
</svg>
